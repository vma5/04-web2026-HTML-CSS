<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sabores do Mundo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Minha Conta</h1>
        <nav><a href="index.html">Início</a>
             <a href="doces.html">Doces</a>
             <a href="salgados.html">Salgados</a>
             <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="login-container">
        <div class="card-login">
            <h2>Criar Conta</h2>
            <form action="#" method="POST">
                <input type="text" placeholder="Nome de usuário" required>
                <input type="email" placeholder="Seu E-mail" required>
                <input type="password" placeholder="Sua Senha" required>
                
                <button type="submit" class="btn-submit">Confirmar Cadastro</button>
            </form>
            <p class="aviso-cadastro">O cadastro permitirá que você poste receitas em breve!</p>
        </div>
    </main>
</body>
</html>
